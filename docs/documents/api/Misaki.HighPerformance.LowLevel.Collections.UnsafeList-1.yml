  assemblies:
  - Misaki.HighPerformance.LowLevel
  namespace: Misaki.HighPerformance.LowLevel.Collections
  summary: Provides a parallel reader for the current list, enabling thread-safe read operations.
  remarks: >-
    The list must live at least as long as the parallel reader, and the parallel reader must not be used after the list is disposed.

    For example, if you need to access the list in job system and wait that job in another stack frame, please always allocate the list struct itself on heap.

    Otherwise the parallel reader will be invalid after the stack frame that creates the list is popped, even if the list's internal array is still valid.
  example: []
  syntax:
    content: public UnsafeList<T>.ParallelReader AsParallelReader()
    return:
      type: Misaki.HighPerformance.LowLevel.Collections.UnsafeList`1.ParallelReader
      description: A <xref href="Misaki.HighPerformance.LowLevel.Collections.UnsafeList%601.ParallelReader" data-throw-if-not-resolved="false"></xref> instance that can be used to read items from the list in a thread-safe manner.
    content.vb: Public Function AsParallelReader() As UnsafeList(Of T).ParallelReader
  overload: Misaki.HighPerformance.LowLevel.Collections.UnsafeList`1.AsParallelReader*
  nameWithType.vb: UnsafeList(Of T).AsParallelReader()
  fullName.vb: Misaki.HighPerformance.LowLevel.Collections.UnsafeList(Of T).AsParallelReader()
