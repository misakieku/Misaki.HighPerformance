    return:
      type: Misaki.HighPerformance.LowLevel.Collections.UnsafeList`1.ParallelWriter
      description: A <xref href="Misaki.HighPerformance.LowLevel.Collections.UnsafeList%601.ParallelWriter" data-throw-if-not-resolved="false"></xref> instance that can be used to add items to the list in a thread-safe manner.
