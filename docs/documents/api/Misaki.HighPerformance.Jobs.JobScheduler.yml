  assemblies:
  - Misaki.HighPerformance.Jobs
  namespace: Misaki.HighPerformance.Jobs
  summary: Schedules a single job for execution on a specified thread, with an optional dependency on another job.
  example: []
  syntax:
    content: 'public JobHandle Schedule<T>(ref readonly T job, bool preferLocal, JobPriority priority = JobPriority.Normal, params ReadOnlySpan<JobHandle> dependencies) where T : IJob'
    parameters:
    - id: job
      type: '{T}'
      description: The job instance to be executed. The job data will be copied internally.
    - id: preferLocal
      type: System.Boolean
      description: A value indicating whether the job should be preferred to run on the local thread.
    - id: priority
      type: Misaki.HighPerformance.Jobs.JobPriority
      description: The priority of the job.
    - id: dependencies
      type: System.ReadOnlySpan{Misaki.HighPerformance.Jobs.JobHandle}
      description: A collection of <xref href="Misaki.HighPerformance.Jobs.JobHandle" data-throw-if-not-resolved="false"></xref> representing the dependencies that must be completed before this job can begin.
    typeParameters:
    - id: T
      description: The type of the job to execute. Must implement <xref href="Misaki.HighPerformance.Jobs.IJob" data-throw-if-not-resolved="false"></xref> and be struct.
    return:
      type: Misaki.HighPerformance.Jobs.JobHandle
      description: A <xref href="Misaki.HighPerformance.Jobs.JobHandle" data-throw-if-not-resolved="false"></xref> that can be used to track the completion of the scheduled job. Returns <xref href="Misaki.HighPerformance.Jobs.JobHandle.Invalid" data-throw-if-not-resolved="false"></xref> if the job data allocation fails.
    content.vb: Public Function Schedule(Of T As IJob)(job As T, preferLocal As Boolean, priority As JobPriority = JobPriority.Normal, dependencies As ReadOnlySpan(Of JobHandle)) As JobHandle
