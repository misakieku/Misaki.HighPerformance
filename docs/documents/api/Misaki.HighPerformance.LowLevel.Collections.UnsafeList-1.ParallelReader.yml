  summary: A Parallel reader for an UnsafeList.
  remarks: >-
    Use <xref href="Misaki.HighPerformance.LowLevel.Collections.UnsafeList%601.AsParallelReader" data-throw-if-not-resolved="false"></xref> to create a parallel reader for a list.

    The list must live and the address of the list remain stable at least as long as the parallel reader, and the parallel reader must not be used after the list is disposed.
