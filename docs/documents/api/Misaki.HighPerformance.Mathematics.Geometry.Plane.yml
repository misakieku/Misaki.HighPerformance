  assemblies:
  - Misaki.HighPerformance.Mathematics
  namespace: Misaki.HighPerformance.Mathematics.Geometry
  summary: Get the signed distance from the point to the plane.
  remarks: >-
    Plane must be normalized prior to calling this function.  Distance is positive if point is on side of the

    plane the normal points to, negative if on the opposite side and zero if the point lies in the plane.

    Avoid comparing equality with 0.0f when testing if a point lies exactly in the plane and use an approximate

    comparison instead.
  example: []
  syntax:
    content: public float SignedDistanceToPoint(float3 point)
    parameters:
    - id: point
      type: Misaki.HighPerformance.Mathematics.float3
      description: Point to find the signed distance with.
    return:
      type: System.Single
      description: Signed distance of the point from the plane.
    content.vb: Public Function SignedDistanceToPoint(point As float3) As Single
  overload: Misaki.HighPerformance.Mathematics.Geometry.Plane.SignedDistanceToPoint*
