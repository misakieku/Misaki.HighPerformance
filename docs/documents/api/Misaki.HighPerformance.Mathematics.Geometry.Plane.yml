  namespace: Misaki.HighPerformance.Mathematics.Geometry
  summary: Creates a normalized Plane directly without normalization cost.
  remarks: >-
    If you have a unit length normal vector, you can create a Plane faster than using one of its constructors

    by calling this function.
  example: []
  syntax:
    content: public static Plane CreateFromUnitNormalAndDistance(float3 unitNormal, float distance)
    parameters:
    - id: unitNormal
      type: Misaki.HighPerformance.Mathematics.float3
      description: A non-zero vector that is perpendicular to the plane.  It must be unit length.
    - id: distance
      type: System.Single
      description: >-
        Distance from the origin along the normal.  A negative value moves the plane in the
            same direction as the normal while a positive value moves it in the opposite direction.
    return:
      type: Misaki.HighPerformance.Mathematics.Geometry.Plane
      description: Normalized Plane constructed from given inputs.
