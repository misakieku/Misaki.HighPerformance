  namespace: Misaki.HighPerformance.LowLevel.Collections
  summary: >-
    A dynamically resizing, parallel, lock-free queue using unmanaged chunks.

    Uses a very brief spin lock only during chunk allocation, alongside a lock-free segment cache.
  example: []
  syntax:
    content: 'public struct UnsafeParallelQueue<T> : IDisposable where T : unmanaged'
    typeParameters:
    - id: T
    content.vb: Public Structure UnsafeParallelQueue(Of T As Structure) Implements IDisposable
