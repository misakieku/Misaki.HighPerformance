name: Publish NuGet Packages (Gitea Registry)

on:
  push:
    branches:
      - main
    paths:
      - 'src/**/*.csproj'
      - '**/*.props'
  workflow_dispatch:

jobs:
  publish:
    name: Publish to Gitea Registry
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: |
          dotnet restore

      - name: Check for new package versions on Gitea Registry
        id: check_versions
        env:
          GITEA_API_KEY: ${{ secrets.NUGET_TOKEN }}
          SOURCE_URL: "https://git.personalnas.com/api/packages/Misaki/nuget"
        run: |
          mkdir -p ./artifacts
          touch ./new_projects.txt

          for projfile in $(find . -name "*.csproj"); do
            GENERATE_PKG=$(dotnet build "$projfile" --getProperty:GeneratePackageOnBuild)
            if [[ "$GENERATE_PKG" != "true" && "$GENERATE_PKG" != "True" ]]; then
              continue
            fi

            PACKAGE_ID=$(dotnet build "$projfile" --getProperty:PackageId)
            VERSION=$(dotnet build "$projfile" --getProperty:Version)

            if [ -z "$PACKAGE_ID" ]; then
              PACKAGE_ID=$(basename "$projfile" .csproj)
            fi

            echo "Checking $PACKAGE_ID version $VERSION on Gitea..."
            LOWER_ID=$(echo "$PACKAGE_ID" | tr '[:upper:]' '[:lower:]')
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: token $GITEA_API_KEY" \
              "${SOURCE_URL}/registration/${LOWER_ID}/${VERSION}.json")

            if [ "$HTTP_CODE" -eq 200 ]; then
              echo "✅ Version $VERSION of $PACKAGE_ID already exists on Gitea. Skipping..."
            else
              echo "🆕 Version $VERSION of $PACKAGE_ID is new on Gitea."
              echo "$projfile" >> ./new_projects.txt
            fi
          done

          if [ -s ./new_projects.txt ]; then
            echo "has_new=true" >> "$GITHUB_OUTPUT"
            echo "Found new packages to publish to Gitea."
          else
            echo "has_new=false" >> "$GITHUB_OUTPUT"
            echo "All packages are already published and up-to-date on Gitea."
          fi

      - name: Run tests
        if: steps.check_versions.outputs.has_new == 'true'
        run: |
          echo "Running all tests before publishing..."
          dotnet test --configuration Release --no-restore --blame-hang-timeout 60s --logger "console;verbosity=detailed"

      - name: Build and Pack New Projects
        if: steps.check_versions.outputs.has_new == 'true'
        run: |
          while IFS= read -r projfile; do
            echo "Building $projfile..."
            if ! dotnet build "$projfile" -c Release; then
              echo "❌ Failed to build $projfile"
              exit 1
            fi

            echo "Packing $projfile..."
            if ! dotnet pack "$projfile" -c Release -o ./artifacts --no-build; then
              echo "❌ Failed to pack $projfile"
              exit 1
            fi
          done < ./new_projects.txt

      - name: Publish new packages to Gitea
        if: steps.check_versions.outputs.has_new == 'true'
        env:
          GITEA_API_KEY: ${{ secrets.NUGET_TOKEN }}
        run: |
          if [ ! -d "./artifacts" ] || [ -z "$(ls -A ./artifacts/*.nupkg 2>/dev/null)" ]; then
            echo "No new packages to publish."
            exit 0
          fi

          for pkg in ./artifacts/*.nupkg; do
            if [[ "$pkg" == *".symbols.nupkg" ]]; then
              continue
            fi

            echo "Pushing $pkg to Gitea Registry..."
            dotnet nuget push "$pkg" \
              --source "https://git.personalnas.com/api/packages/Misaki/nuget/index.json" \
              --api-key "$GITEA_API_KEY" \
              --skip-duplicate
          done
